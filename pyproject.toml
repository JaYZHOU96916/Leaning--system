[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "academic-os"
version = "0.1.0"
description = "Canvas Academic OS backend"
requires-python = ">=3.13,<3.15"
dependencies = [
  "apscheduler>=3.11,<4.0",
  "fastapi>=0.141,<0.142",
  "httpx>=0.28,<0.29",
  "icalendar>=6.1,<7.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
  "python-pptx>=1.0,<2.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlmodel>=0.0.22,<1.0",
  "cryptography>=43.0,<45.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.6,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
